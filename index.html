<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="도배 작업용 간편 견적 계산기">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>도배 견적 계산기</title>
<style>
:root{--black:#111;--gray:#666;--line:#e5e5e5;--bg:#f6f6f6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--black);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Malgun Gothic",sans-serif}
.wrap{max-width:620px;margin:0 auto;padding:18px 14px 40px}
h1{font-size:25px;text-align:center;margin:8px 0 18px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
label.title{display:block;font-weight:700;margin-bottom:9px}
select,input[type=number]{width:100%;height:46px;border:1px solid #ccc;border-radius:10px;background:#fff;padding:0 12px;font-size:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.options{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.option{position:relative}
.option input{position:absolute;opacity:0}
.option span{display:flex;align-items:center;justify-content:center;min-height:44px;border:1px solid #ccc;border-radius:10px;padding:8px;background:#fff}
.option input:checked+span{background:#111;color:#fff;border-color:#111}
.check{display:flex;align-items:center;gap:10px;margin:11px 0;font-size:15px}
.check input{width:20px;height:20px}
.roll-row{display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center;margin-top:10px}
.roll-name{font-size:14px}
.roll-row input{height:42px}
.price{color:#666;font-size:13px;margin-top:4px}
.note{font-size:13px;color:#555;line-height:1.6;margin-top:10px}
.result{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}
.line{display:flex;justify-content:space-between;gap:12px;margin:8px 0;font-size:15px}
.total{font-size:23px;font-weight:800;display:flex;justify-content:space-between;margin-top:15px;padding-top:14px;border-top:2px solid #111}
button{width:100%;height:50px;border:0;border-radius:12px;background:#111;color:#fff;font-size:16px;font-weight:700;margin-top:10px}
button.secondary{background:#fff;color:#111;border:1px solid #ccc}
.install{display:none}
.small{font-size:12px;color:#777}
@media print{
 body{background:#fff}
 .wrap{max-width:none;padding:0}
 .no-print{display:none!important}
 .card{border:0;padding:0;margin-bottom:18px}
 h1{margin-top:0}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>도배 견적 계산기</h1>

  <div class="card">
    <label class="title">평수</label>
    <select id="area">
      <option value="25">25평</option>
      <option value="33">33평</option>
      <option value="45">45평</option>
      <option value="51">51평</option>
    </select>
  </div>

  <div class="card">
    <label class="title">벽지</label>
    <div class="options">
      <label class="option"><input type="radio" name="paper" value="s" checked><span>소폭</span></label>
      <label class="option"><input type="radio" name="paper" value="w"><span>광폭</span></label>
      <label class="option"><input type="radio" name="paper" value="i"><span>실크</span></label>
    </div>
    <div class="note">소폭 15,000원/롤 · 광폭 21,500원/롤 · 실크 44,000원/롤</div>
    <div class="note">※ 실크 선택 시 부자재 비용 100,000원이 자동 적용됩니다.</div>
  </div>

  <div class="card">
    <label class="title">천장</label>
    <div class="options">
      <label class="option"><input type="radio" name="ceiling" value="yes" checked><span>포함</span></label>
      <label class="option"><input type="radio" name="ceiling" value="no"><span>제외</span></label>
    </div>
  </div>

  <div class="card">
    <label class="title">인원</label>
    <select id="workers">
      <option>1</option><option>2</option><option>3</option><option>4</option>
      <option>5</option><option>6</option><option>7</option><option>8</option>
    </select>
    <div class="price">1명당 260,000원</div>
  </div>

  <div class="card">
    <label class="title">부대비용</label>
    <label class="check"><input id="prep" type="checkbox" checked> 초배작업 <span class="small">10,000원/평</span></label>
    <label class="check"><input id="food" type="checkbox" checked> 식비 <span class="small">20,000원/인</span></label>
    <label class="check"><input id="waste" type="checkbox" checked> 폐기물 처리 <span class="small">50,000원</span></label>
  </div>

  <div class="card">
    <label class="title">롤 수량 (필요하면 직접 수정)</label>
    <div class="roll-row"><div class="roll-name">소폭 <div class="price">15,000원/롤</div></div><input id="rollS" type="number" min="0"></div>
    <div class="roll-row"><div class="roll-name">광폭 <div class="price">21,500원/롤</div></div><input id="rollW" type="number" min="0"></div>
    <div class="roll-row"><div class="roll-name">실크 <div class="price">44,000원/롤</div></div><input id="rollI" type="number" min="0"></div>
  </div>

  <div class="card">
    <label class="title">견적 내역</label>
    <div id="result"></div>
    <button class="no-print" onclick="window.print()">견적서 인쇄 / PDF 저장</button>
    <button id="installBtn" class="secondary no-print install">홈 화면에 설치</button>
  </div>
</div>

<script>
const counts={
  25:{s:38,w:20,i:17},
  33:{s:48,w:26,i:23},
  45:{s:65,w:35,i:31},
  51:{s:80,w:44,i:38}
};
const prices={s:15000,w:21500,i:44000};
const names={s:"소폭",w:"광폭",i:"실크"};
const area=document.getElementById("area");
const workers=document.getElementById("workers");
const rollS=document.getElementById("rollS");
const rollW=document.getElementById("rollW");
const rollI=document.getElementById("rollI");
const result=document.getElementById("result");

function paper(){return document.querySelector('input[name="paper"]:checked').value}
function ceiling(){return document.querySelector('input[name="ceiling"]:checked').value}
function setRolls(){
  const c=counts[area.value];
  if(ceiling()==="no"){
    rollS.value=Math.ceil(c.s*.82);
    rollW.value=Math.ceil(c.w*.82);
    rollI.value=Math.ceil(c.i*.82);
  }else{
    rollS.value=c.s; rollW.value=c.w; rollI.value=c.i;
  }
}
function won(n){return n.toLocaleString("ko-KR")+"원"}
function calculate(){
  const p=paper(), a=Number(area.value), w=Number(workers.value);
  const rs=Number(rollS.value||0), rw=Number(rollW.value||0), ri=Number(rollI.value||0);
  const roll=p==="s"?rs:p==="w"?rw:ri;
  const wall=roll*prices[p];
  const material=p==="i"?100000:0;
  const labor=w*260000;
  const prep=document.getElementById("prep").checked?a*10000:0;
  const food=document.getElementById("food").checked?w*20000:0;
  const waste=document.getElementById("waste").checked?50000:0;
  const total=wall+material+labor+prep+food+waste;
  const lines=[
    ["벽지", `${names[p]} ${roll}롤`, wall],
    ...(material?[["부자재","실크 자동 적용",material]]:[]),
    ["인건비", `${w}명`, labor],
    ...(prep?[["초배작업",`${a}평`,prep]]:[]),
    ...(food?[["식비",`${w}명`,food]]:[]),
    ...(waste?[["폐기물 처리","",waste]]:[])
  ];
  result.innerHTML=lines.map(x=>`<div class="line"><span>${x[0]} ${x[1]?`<small>(${x[1]})</small>`:""}</span><strong>${won(x[2])}</strong></div>`).join("")
    + `<div class="total"><span>총 견적</span><span>${won(total)}</span></div>`;
}
document.querySelectorAll('input[name="paper"],input[name="ceiling"]').forEach(x=>x.addEventListener("change",()=>{setRolls();calculate()}));
[area,workers,rollS,rollW,rollI,document.getElementById("prep"),document.getElementById("food"),document.getElementById("waste")].forEach(x=>x.addEventListener("input",calculate));
[area,workers].forEach(x=>x.addEventListener("change",()=>{if(x===area)setRolls();calculate()}));
setRolls();calculate();

let deferredPrompt;
window.addEventListener("beforeinstallprompt",e=>{
  e.preventDefault(); deferredPrompt=e;
  const b=document.getElementById("installBtn"); b.style.display="block";
});
document.getElementById("installBtn").addEventListener("click",async()=>{
  if(!deferredPrompt)return;
  deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null;
});
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(console.error));
}
</script>
</body>
</html>
