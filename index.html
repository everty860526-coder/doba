<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#202124">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="도배 견적">
<link rel="manifest" href="manifest.json">
<title>도배 견적 계산기</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f7;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",Arial,sans-serif}
.container{max-width:620px;margin:0 auto;padding:18px}
h1{text-align:center;margin:5px 0 18px;font-size:27px}
.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 3px 12px rgba(0,0,0,.07)}
.title{font-size:18px;font-weight:800;margin-bottom:13px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.grid.four{grid-template-columns:repeat(4,1fr)}
button.opt{border:1px solid #d8dce2;background:#fff;border-radius:12px;padding:13px 5px;font-size:16px;font-weight:700;cursor:pointer}
button.opt.active{background:#222;color:#fff;border-color:#222}
.paper{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.paper button{padding:14px 5px}
.paper small{display:block;font-size:12px;margin-top:4px;font-weight:400}
.row{display:flex;gap:10px;align-items:center}
input[type=number]{width:100%;padding:11px;border:1px solid #d5d9df;border-radius:10px;font-size:16px}
.check{display:flex;align-items:center;gap:9px;margin:10px 0;font-size:16px}
.check input{width:19px;height:19px}
.material{border-top:1px solid #eee;margin-top:12px;padding-top:10px}
.material-title{font-weight:800;margin-bottom:8px}
.material-row{display:grid;grid-template-columns:1fr 85px 100px;gap:7px;align-items:center;margin:7px 0;font-size:14px}
.material-row input{padding:8px;font-size:14px}
.info{font-size:13px;color:#777;margin-top:8px}
.summary{background:#202124;color:#fff;border-radius:18px;padding:18px}
.sumline{display:flex;justify-content:space-between;padding:8px 0;color:#e9e9e9}
.total{border-top:1px solid #555;margin-top:8px;padding-top:15px;display:flex;justify-content:space-between;align-items:center}
.total strong{font-size:27px}
.print{width:100%;border:0;border-radius:12px;background:#fff;color:#222;padding:14px;font-size:16px;font-weight:800;margin-top:15px;cursor:pointer}
.note{font-size:12px;color:#777;line-height:1.5}
@media(max-width:420px){.grid.four{grid-template-columns:repeat(2,1fr)}.material-row{grid-template-columns:1fr 70px 90px}}
@media print{body{background:#fff}.container{max-width:none}.print{display:none}.card,.summary{box-shadow:none}}
</style>
</head>
<body>
<div class="container">
<h1>도배 견적 계산기</h1>

<div class="card">
<div class="title">① 평수 선택</div>
<div class="grid four" id="areaBtns">
<button class="opt active" data-area="25">25평</button>
<button class="opt" data-area="33">33평</button>
<button class="opt" data-area="45">45평</button>
<button class="opt" data-area="51">51평</button>
</div>
</div>

<div class="card">
<div class="title">② 벽지 종류</div>
<div class="paper" id="paperBtns">
<button class="opt active" data-paper="s">소폭<small>15,000원</small></button>
<button class="opt" data-paper="w">광폭<small>21,500원</small></button>
<button class="opt" data-paper="i">실크<small>44,000원</small></button>
</div>
<div class="info" id="rollInfo"></div>
<div class="row" style="margin-top:12px">
<div style="flex:1"><b>롤 수 직접 수정</b></div>
<div style="width:130px"><input id="rolls" type="number" min="0"></div>
</div>

<div class="material" id="materialBox" style="display:none">
<div class="material-title">부자재 비용</div>
<div class="sumline"><span id="materialLabel">부자재</span><b>100,000원</b></div>
<div class="note">※ 실크 선택 시 부자재 비용 150,000원이 자동 적용됩니다.</div>
</div>
</div>

<div class="card">
<div class="title">③ 천장</div>
<div class="grid">
<button class="opt active" data-ceil="yes">포함</button>
<button class="opt" data-ceil="no">제외</button>
</div>
</div>

<div class="card">
<div class="title">④ 인원 선택 <span style="font-size:13px;color:#777;font-weight:400"> (1명당 260,000원)</span></div>
<div class="grid">
<button class="opt active" data-workers="1">1명</button>
<button class="opt" data-workers="2">2명</button>
<button class="opt" data-workers="3">3명</button>
<button class="opt" data-workers="4">4명</button>
<button class="opt" data-workers="5">5명</button>
<button class="opt" data-workers="6">6명</button>
<button class="opt" data-workers="7">7명</button>
<button class="opt" data-workers="8">8명</button>
</div>
</div>

<div class="card">
<div class="title">⑤ 부대비용</div>
<label class="check"><input type="checkbox" id="primer" checked> 초배작업 <span>평당 10,000원</span></label>
<label class="check"><input type="checkbox" id="meal" checked> 식비 <span>인당 20,000원</span></label>
<label class="check"><input type="checkbox" id="waste" checked> 폐기물 처리 <span>50,000원</span></label>
</div>

<div class="summary">
<div class="title">견적 내역</div>
<div class="sumline"><span>벽지</span><b id="mat">0원</b></div>
<div id="materialSummary"></div>
<div class="sumline"><span>인건비</span><b id="labor">0원</b></div>
<div class="sumline"><span>초배작업</span><b id="primerCost">0원</b></div>
<div class="sumline"><span>식비</span><b id="mealCost">0원</b></div>
<div class="sumline"><span>폐기물</span><b id="wasteCost">0원</b></div>
<div class="total"><span>총 견적금액</span><strong id="total">0원</strong></div>
<button class="print" id="installBtn" style="display:none;background:#e8eaed;margin-bottom:8px">📱 홈 화면에 추가</button>
<button class="print" onclick="window.print()">견적서 인쇄 / PDF 저장</button>
</div>
</div>

<script>
const counts={25:{s:38,w:20,i:17},33:{s:48,w:26,i:23},45:{s:65,w:35,i:31},51:{s:80,w:44,i:38}};
const prices={s:15000,w:21500,i:44000};
const names={s:"소폭",w:"광폭",i:"실크"};
let area=25,paper="s",ceil=true,workers=1;

const won=n=>n.toLocaleString("ko-KR")+"원";
const rolls=document.getElementById("rolls");

const materialCost=paper==="i"?100000:0;

function setActive(selector,el){
 document.querySelectorAll(selector).forEach(x=>x.classList.remove("active"));
 el.classList.add("active");
}

function updateRoll(){
 const base=counts[area][paper];
 rolls.value=ceil?base:Math.ceil(base*.82);
 renderMaterials();
 calc();
}

function renderMaterials(){
 const box=document.getElementById("materialBox");
 box.style.display=paper==="i"?"block":"none";
 document.getElementById("materialLabel").textContent="실크 부자재(네바리·운용지·삼중지·텍스)";
}
function getMaterialTotal(){ return paper==="i"?100000:0; }
function getMaterialLines(){
 if(paper!=="i") return "";
 return `<div class="sumline"><span>실크 부자재</span><b>100,000원</b></div>`;
}

function calc(){
 const r=Number(rolls.value)||0;
 const material=r*prices[paper];
 const sub=getMaterialTotal();
 const labor=workers*260000;
 const primer=document.getElementById("primer").checked?area*10000:0;
 const meal=document.getElementById("meal").checked?workers*20000:0;
 const waste=document.getElementById("waste").checked?50000:0;
 document.getElementById("mat").textContent=won(material);
 document.getElementById("materialSummary").innerHTML=getMaterialLines();
 document.getElementById("labor").textContent=won(labor);
 document.getElementById("primerCost").textContent=won(primer);
 document.getElementById("mealCost").textContent=won(meal);
 document.getElementById("wasteCost").textContent=won(waste);
 document.getElementById("total").textContent=won(material+sub+labor+primer+meal+waste);
 document.getElementById("rollInfo").textContent=
 `${names[paper]} ${won(prices[paper])} × ${r}롤 = ${won(material)}`+
 (paper==="s"?"":" + 부자재 자동계산");
}

document.querySelectorAll("#areaBtns button").forEach(b=>b.onclick=()=>{
 area=Number(b.dataset.area);setActive("#areaBtns button",b);updateRoll();
});
document.querySelectorAll("#paperBtns button").forEach(b=>b.onclick=()=>{
 paper=b.dataset.paper;setActive("#paperBtns button",b);updateRoll();
});
document.querySelectorAll("[data-ceil]").forEach(b=>b.onclick=()=>{
 ceil=b.dataset.ceil==="yes";setActive("[data-ceil]",b);updateRoll();
});
document.querySelectorAll("[data-workers]").forEach(b=>b.onclick=()=>{
 workers=Number(b.dataset.workers);setActive("[data-workers]",b);calc();
});
rolls.oninput=calc;
["primer","meal","waste"].forEach(id=>document.getElementById(id).onchange=calc);
updateRoll();


let deferredPrompt=null;
const installBtn=document.getElementById("installBtn");
window.addEventListener("beforeinstallprompt",e=>{
 e.preventDefault(); deferredPrompt=e; installBtn.style.display="block";
});
installBtn.onclick=async()=>{
 if(!deferredPrompt){alert("브라우저 메뉴에서 '홈 화면에 추가'를 선택해주세요.");return;}
 deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; installBtn.style.display="none";
};
window.addEventListener("appinstalled",()=>{installBtn.style.display="none";});
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("service-worker.js"));
</script>
</body>
</html>
