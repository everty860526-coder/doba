<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />

  <title>도배 견적 계산기</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      background: #eeeeee;
    }

    body {
      margin: 0;
      background: #eeeeee;
      color: #111111;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        "Malgun Gothic",
        sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .app {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    .title {
      font-size: 38px;
      line-height: 1.08;
      font-weight: 900;
      letter-spacing: -2.8px;
      margin: 4px 0 26px;
    }

    .section {
      margin-bottom: 14px;
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 1px 0 rgba(0,0,0,.02);
    }

    .section-title {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -0.8px;
      margin-bottom: 16px;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .choice-btn {
      height: 48px;
      border: 0;
      border-radius: 12px;
      background: #eeeeee;
      color: #111111;
      font-weight: 800;
      cursor: pointer;
    }

    .choice-btn.selected {
      background: #000000;
      color: #ffffff;
    }

    .wallpaper-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .wallpaper-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 13px 14px;
      background: #f2f2f2;
      border-radius: 13px;
      cursor: pointer;
    }

    .wallpaper-row.selected {
      background: #000000;
      color: #ffffff;
    }

    .wallpaper-main {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .wallpaper-name {
      font-weight: 900;
      white-space: nowrap;
    }

    .price {
      font-size: 13px;
      opacity: .65;
      font-weight: 700;
    }

    .selected .price {
      opacity: .8;
    }

    .wallpaper-row input[type="radio"] {
      display: none;
    }

    .roll-control {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .roll-input {
      width: 64px;
      height: 36px;
      border: 0;
      border-radius: 9px;
      background: #ffffff;
      text-align: center;
      font-size: 16px;
      font-weight: 900;
      outline: none;
    }

    .selected .roll-input {
      background: #ffffff;
      color: #111111;
    }

    .roll-label {
      font-size: 12px;
      font-weight: 800;
      opacity: .7;
    }

    .dropdown-wrap {
      position: relative;
    }

    .person-select {
      appearance: none;
      -webkit-appearance: none;
      width: 100%;
      height: 48px;
      border: 0;
      border-bottom: 2px solid #111111;
      border-radius: 0;
      background: transparent;
      padding: 0 34px 0 2px;
      font-size: 18px;
      font-weight: 800;
      color: #111111;
      outline: none;
    }

    .person-select.placeholder {
      color: #777777;
    }

    .dropdown-arrow {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      font-size: 18px;
      font-weight: 900;
    }

    .ceiling-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .info {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #f1f1f1;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.5;
    }

    .extras {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .check-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 14px;
      border-radius: 12px;
      background: #f2f2f2;
      cursor: pointer;
      font-weight: 800;
    }

    .check-row input {
      width: 21px;
      height: 21px;
      accent-color: #000000;
    }

    .estimate {
      margin-top: 18px;
      background: #000000;
      color: #ffffff;
      border-radius: 20px;
      overflow: hidden;
    }

    .estimate-header {
      padding: 22px 20px 8px;
      font-size: 21px;
      font-weight: 900;
    }

    .estimate-body {
      padding: 10px 20px 20px;
    }

    .estimate-line {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 9px 0;
      color: #dddddd;
      font-size: 14px;
      font-weight: 700;
    }

    .estimate-line span:last-child {
      color: #ffffff;
      text-align: right;
      white-space: nowrap;
    }

    .total {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 15px;
      margin-top: 13px;
      padding-top: 17px;
      border-top: 1px solid #333333;
    }

    .total-label {
      font-size: 17px;
      font-weight: 900;
    }

    .total-price {
      font-size: 30px;
      font-weight: 950;
      letter-spacing: -1px;
      white-space: nowrap;
    }

    .print-btn {
      width: 100%;
      height: 54px;
      margin-top: 14px;
      border: 2px solid #ffffff;
      border-radius: 12px;
      background: #ffffff;
      color: #000000;
      font-weight: 900;
      cursor: pointer;
    }

    .note {
      margin-top: 9px;
      font-size: 12px;
      line-height: 1.5;
      color: #bbbbbb;
    }

    @media (max-width: 390px) {
      .app {
        padding-left: 12px;
        padding-right: 12px;
      }

      .title {
        font-size: 34px;
      }

      .card {
        padding: 17px;
      }

      .buttons {
        gap: 6px;
      }

      .choice-btn {
        font-size: 14px;
      }

      .wallpaper-row {
        padding: 11px;
      }

      .roll-input {
        width: 56px;
      }

      .total-price {
        font-size: 25px;
      }
    }

    @media print {
      body {
        background: #ffffff;
      }

      .app {
        max-width: 760px;
        padding: 20px;
      }

      .choice-btn,
      .wallpaper-row,
      .check-row,
      .person-select,
      .roll-input {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .print-btn {
        display: none;
      }

      .estimate {
        break-inside: avoid;
      }
    }
  </style>
</head>

<body>
  <main class="app">

    <h1 class="title">도배 견적 계산기</h1>

    <!-- ① 평수 -->
    <section class="section">
      <div class="card">
        <div class="section-title">① 평수 선택</div>

        <div class="buttons" id="areaButtons">
          <button class="choice-btn" data-area="25">25평</button>
          <button class="choice-btn" data-area="33">33평</button>
          <button class="choice-btn" data-area="45">45평</button>
          <button class="choice-btn" data-area="51">51평</button>
        </div>
      </div>
    </section>

    <!-- ② 벽지 -->
    <section class="section">
      <div class="card">
        <div class="section-title">② 벽지 종류</div>

        <div class="wallpaper-list">

          <label class="wallpaper-row" data-wallpaper="small">
            <div class="wallpaper-main">
              <input type="radio" name="wallpaper" value="small">
              <div>
                <div class="wallpaper-name">소폭</div>
                <div class="price">15,000원 / 롤</div>
              </div>
            </div>

            <div class="roll-control">
              <input class="roll-input" id="smallRolls" type="number" min="0">
              <span class="roll-label">롤</span>
            </div>
          </label>

          <label class="wallpaper-row" data-wallpaper="wide">
            <div class="wallpaper-main">
              <input type="radio" name="wallpaper" value="wide">
              <div>
                <div class="wallpaper-name">광폭</div>
                <div class="price">21,500원 / 롤</div>
              </div>
            </div>

            <div class="roll-control">
              <input class="roll-input" id="wideRolls" type="number" min="0">
              <span class="roll-label">롤</span>
            </div>
          </label>

          <label class="wallpaper-row" data-wallpaper="silk">
            <div class="wallpaper-main">
              <input type="radio" name="wallpaper" value="silk">
              <div>
                <div class="wallpaper-name">실크</div>
                <div class="price">44,000원 / 롤</div>
              </div>
            </div>

            <div class="roll-control">
              <input class="roll-input" id="silkRolls" type="number" min="0">
              <span class="roll-label">롤</span>
            </div>
          </label>

        </div>

        <div class="info" id="silkInfo" style="display:none;">
          ※ 실크 선택 시 부자재 비용 100,000원이 자동 적용됩니다.
        </div>
      </div>
    </section>

    <!-- ③ 천장 -->
    <section class="section">
      <div class="card">
        <div class="section-title">③ 천장</div>

        <div class="ceiling-buttons">
          <button class="choice-btn selected" data-ceiling="include">
            포함
          </button>

          <button class="choice-btn" data-ceiling="exclude">
            제외
          </button>
        </div>
      </div>
    </section>

    <!-- ④ 인원 -->
    <section class="section">
      <div class="card">
        <div class="section-title">④ 인원 선택</div>

        <div class="dropdown-wrap">
          <select id="personSelect" class="person-select placeholder">
            <option value="" selected disabled>인원 수를 선택하세요.</option>
            <option value="1">1명</option>
            <option value="2">2명</option>
            <option value="3">3명</option>
            <option value="4">4명</option>
            <option value="5">5명</option>
            <option value="6">6명</option>
            <option value="7">7명</option>
            <option value="8">8명</option>
          </select>

          <div class="dropdown-arrow">⌄</div>
        </div>
      </div>
    </section>

    <!-- ⑤ 부대비용 -->
    <section class="section">
      <div class="card">
        <div class="section-title">⑤ 부대비용</div>

        <div class="extras">

          <label class="check-row">
            <span>초배작업</span>
            <input id="prepCheck" type="checkbox" checked>
          </label>

          <label class="check-row">
            <span>식비</span>
            <input id="mealCheck" type="checkbox" checked>
          </label>

          <label class="check-row">
            <span>폐기물 처리</span>
            <input id="wasteCheck" type="checkbox" checked>
          </label>

        </div>
      </div>
    </section>

    <!-- 견적 내역 -->
    <section class="estimate">

      <div class="estimate-header">
        견적 내역
      </div>

      <div class="estimate-body">

        <div class="estimate-line">
          <span>벽지비</span>
          <span id="wallpaperCost">0원</span>
        </div>

        <div class="estimate-line">
          <span>부자재</span>
          <span id="materialCost">0원</span>
        </div>

        <div class="estimate-line">
          <span>인건비</span>
          <span id="laborCost">0원</span>
        </div>

        <div class="estimate-line">
          <span>초배작업</span>
          <span id="prepCost">0원</span>
        </div>

        <div class="estimate-line">
          <span>식비</span>
          <span id="mealCost">0원</span>
        </div>

        <div class="estimate-line">
          <span>폐기물 처리</span>
          <span id="wasteCost">0원</span>
        </div>

        <div class="total">
          <div class="total-label">총 견적금액</div>
          <div class="total-price" id="totalCost">0원</div>
        </div>

        <button class="print-btn" id="printBtn">
          견적서 인쇄 / PDF 저장
        </button>

        <div class="note">
          ※ PDF 저장은 휴대폰의 인쇄 화면에서 'PDF로 저장'을 선택하면 됩니다.
        </div>

      </div>
    </section>

  </main>

  <script>
    const PRICE = {
      small: 15000,
      wide: 21500,
      silk: 44000
    };

    const BASE_ROLLS = {
      25: {
        small: 38,
        wide: 20,
        silk: 17
      },
      33: {
        small: 48,
        wide: 26,
        silk: 23
      },
      45: {
        small: 65,
        wide: 35,
        silk: 31
      },
      51: {
        small: 80,
        wide: 44,
        silk: 38
      }
    };

    const MATERIAL_COST = {
      small: 0,
      wide: 0,
      silk: 100000
    };

    const LABOR_PER_PERSON = 260000;

    let selectedArea = 25;
    let selectedWallpaper = "small";
    let selectedCeiling = "include";

    const money = value =>
      `${Math.round(value).toLocaleString("ko-KR")}원`;

    function getRollInput(type) {
      if (type === "small") return document.getElementById("smallRolls");
      if (type === "wide") return document.getElementById("wideRolls");
      return document.getElementById("silkRolls");
    }

    function setDefaultRolls() {
      document.getElementById("smallRolls").value =
        BASE_ROLLS[selectedArea].small;

      document.getElementById("wideRolls").value =
        BASE_ROLLS[selectedArea].wide;

      document.getElementById("silkRolls").value =
        BASE_ROLLS[selectedArea].silk;
    }

    function getCurrentRolls() {
      const input = getRollInput(selectedWallpaper);

      let rolls = Number(input.value);

      if (!Number.isFinite(rolls) || rolls < 0) {
        rolls = 0;
      }

      rolls = Math.floor(rolls);

      return rolls;
    }

    function getAppliedRolls() {
      const rolls = getCurrentRolls();

      if (selectedCeiling === "exclude") {
        return Math.ceil(rolls * 0.82);
      }

      return rolls;
    }

    function updateAreaUI() {
      document.querySelectorAll("#areaButtons .choice-btn")
        .forEach(button => {
          button.classList.toggle(
            "selected",
            Number(button.dataset.area) === selectedArea
          );
        });
    }

    function updateWallpaperUI() {
      document.querySelectorAll(".wallpaper-row")
        .forEach(row => {
          const type = row.dataset.wallpaper;
          const selected = type === selectedWallpaper;

          row.classList.toggle("selected", selected);

          const radio = row.querySelector("input[type=radio]");
          radio.checked = selected;
        });

      document.getElementById("silkInfo").style.display =
        selectedWallpaper === "silk" ? "block" : "none";
    }

    function updateCeilingUI() {
      document.querySelectorAll("[data-ceiling]")
        .forEach(button => {
          button.classList.toggle(
            "selected",
            button.dataset.ceiling === selectedCeiling
          );
        });
    }

    function updatePersonUI() {
      const select = document.getElementById("personSelect");

      if (select.value) {
        select.classList.remove("placeholder");
      } else {
        select.classList.add("placeholder");
      }
    }

    function calculate() {
      const personSelect = document.getElementById("personSelect");
      const people = Number(personSelect.value) || 0;

      const rolls = getAppliedRolls();

      const wallpaperCost =
        rolls * PRICE[selectedWallpaper];

      const materialCost =
        MATERIAL_COST[selectedWallpaper];

      const laborCost =
        people * LABOR_PER_PERSON;

      const prepCost =
        document.getElementById("prepCheck").checked
          ? selectedArea * 10000
          : 0;

      const mealCost =
        document.getElementById("mealCheck").checked
          ? people * 20000
          : 0;

      const wasteCost =
        document.getElementById("wasteCheck").checked
          ? 50000
          : 0;

      const total =
        wallpaperCost +
        materialCost +
        laborCost +
        prepCost +
        mealCost +
        wasteCost;

      document.getElementById("wallpaperCost").textContent =
        money(wallpaperCost);

      document.getElementById("materialCost").textContent =
        money(materialCost);

      document.getElementById("laborCost").textContent =
        money(laborCost);

      document.getElementById("prepCost").textContent =
        money(prepCost);

      document.getElementById("mealCost").textContent =
        money(mealCost);

      document.getElementById("wasteCost").textContent =
        money(wasteCost);

      document.getElementById("totalCost").textContent =
        money(total);
    }

    document.querySelectorAll("#areaButtons .choice-btn")
      .forEach(button => {
        button.addEventListener("click", () => {
          selectedArea = Number(button.dataset.area);

          setDefaultRolls();
          updateAreaUI();
          calculate();
        });
      });

    document.querySelectorAll(".wallpaper-row")
      .forEach(row => {
        row.addEventListener("click", event => {
          if (event.target.classList.contains("roll-input")) {
            return;
          }

          selectedWallpaper = row.dataset.wallpaper;

          updateWallpaperUI();
          calculate();
        });
      });

    document.querySelectorAll(".roll-input")
      .forEach(input => {
        input.addEventListener("input", () => {
          if (Number(input.value) < 0) {
            input.value = 0;
          }

          calculate();
        });
      });

    document.querySelectorAll("[data-ceiling]")
      .forEach(button => {
        button.addEventListener("click", () => {
          selectedCeiling = button.dataset.ceiling;

          updateCeilingUI();
          calculate();
        });
      });

    document.getElementById("personSelect")
      .addEventListener("change", () => {
        updatePersonUI();
        calculate();
      });

    [
      "prepCheck",
      "mealCheck",
      "wasteCheck"
    ].forEach(id => {
      document.getElementById(id)
        .addEventListener("change", calculate);
    });

    document.getElementById("printBtn")
      .addEventListener("click", () => {
        window.print();
      });

    // 초기 상태
    setDefaultRolls();
    updateAreaUI();
    updateWallpaperUI();
    updateCeilingUI();
    updatePersonUI();
    calculate();

    // PWA Service Worker
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js")
          .catch(error => {
            console.log("Service Worker 등록 실패:", error);
          });
      });
    }
  </script>
</body>
</html>
