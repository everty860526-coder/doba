<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7fafc">
<meta name="description" content="도배 견적 계산기"><meta name="app-version" content="2026-09-28-v3">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>도배 견적 계산기</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f4f8fb;--card:#fff;--ink:#111;--muted:#6d747b;--line:#dfe3e7;--black:#202020}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans KR","Malgun Gothic",sans-serif}
button,input,select{font:inherit}
.app{max-width:850px;margin:0 auto;padding:12px 18px 30px}
.top{height:66px;display:flex;align-items:center;justify-content:center;position:relative}
.home{position:absolute;left:5px;top:10px;width:46px;height:46px;border:0;background:transparent;font-size:30px;color:#111}
h1{font-size:32px;margin:0;font-weight:900;letter-spacing:-1.5px}
.card{background:rgba(255,255,255,.96);border-radius:22px;padding:17px 27px;margin:12px 0;box-shadow:0 1px 8px rgba(0,0,0,.04)}
.label{font-size:21px;font-weight:900;margin-bottom:13px;letter-spacing:-.5px}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{height:54px;border:1px solid #d8d8d8;border-radius:13px;background:#fff;color:#111;font-weight:800;font-size:19px}
.opt.selected{background:var(--black);border-color:var(--black);color:#fff}
.wall-note{font-size:16px;color:#7c8389;font-weight:600;margin:13px 0 8px}
.roll-row{display:flex;align-items:center;justify-content:space-between;gap:18px}
.roll-label{font-size:19px;font-weight:900}
.roll-input{width:245px;height:57px;border:1px solid #d8d8d8;border-radius:13px;padding:0 18px;font-size:19px;font-weight:700;color:#111;background:#fff}
.select-wrap{position:relative}
.select{width:100%;height:54px;border:0;border-bottom:2px solid #222;border-radius:0;background:#fff;color:#111;padding:0 14px;font-size:18px;font-weight:600;appearance:auto}
.subrow{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.checkline{display:flex;align-items:center;gap:13px;font-size:18px;font-weight:800;margin:13px 0}
.checkline input{appearance:none;width:25px;height:25px;border-radius:5px;border:2px solid #333;margin:0;position:relative;background:#fff}
.checkline input:checked{background:#202020}
.checkline input:checked:after{content:"✓";position:absolute;color:#fff;font-size:20px;left:3px;top:-1px;font-weight:900}
.cost{background:#202020;color:#fff;border-radius:20px;padding:20px 26px;margin-top:13px}
.cost h2{margin:0 0 10px;font-size:23px}
.costline{display:flex;justify-content:space-between;font-size:18px;font-weight:700;padding:4px 0}
.total{border-top:1px solid #666;margin-top:12px;padding-top:14px;display:flex;justify-content:space-between;align-items:end;font-size:19px;font-weight:900}
.total strong{font-size:30px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.action{height:62px;border:0;border-radius:15px;background:#fff;color:#111;font-size:18px;font-weight:900;box-shadow:0 1px 8px rgba(0,0,0,.04)}
.action.dark{background:#202020;color:#fff}
.note{font-size:14px;color:#5f666c;font-weight:700;line-height:1.55}
@media(max-width:600px){
 .app{padding:8px 10px 25px}.top{height:62px}h1{font-size:26px}.card{padding:15px 18px;border-radius:18px}.label{font-size:19px}
 .opt{font-size:17px}.wall-note{font-size:14px}.roll-input{width:42%;min-width:130px}.roll-label{font-size:17px}.cost{padding:17px 18px}.costline{font-size:16px}.total strong{font-size:27px}
 .actions{gap:10px}.action{font-size:16px}.checkline{font-size:16px}
}
@media print{
 body{background:#fff}.home,.actions{display:none}.card{box-shadow:none;border:1px solid #ddd}.cost{break-inside:avoid}
}
</style>
</head>
<body>
<main class="app">
<header class="top">
<button class="home" id="homeBtn" aria-label="처음으로">⌂</button>
<h1>도배 견적 계산기</h1>
</header>

<section class="card">
<div class="label">① 평수 선택</div>
<div class="grid4" id="areaBtns"></div>
</section>

<section class="card">
<div class="label">② 벽지 종류</div>
<div class="grid3" id="wallBtns"></div>
<div class="wall-note" id="paperNote"></div>
<div class="roll-row">
<div class="roll-label">롤 수 직접 수정</div>
<input class="roll-input" id="rolls" type="number" min="0" inputmode="numeric">
</div>
</section>

<section class="card">
<div class="label">③ 천장</div>
<div class="grid4" id="ceilingBtns"></div>
</section>

<section class="card">
<div class="label">④ 인원 선택</div>
<div class="select-wrap">
<select class="select" id="people">
<option value="">인원 수를 선택하세요.</option>
<option value="1">1명</option><option value="2">2명</option><option value="3">3명</option>
<option value="4">4명</option><option value="5">5명</option><option value="6">6명</option>
</select>
</div>
</section>

<section class="card">
<div class="label">⑤ 부대비용</div>
<label class="checkline"><input id="prepOn" type="checkbox" checked><span>초배작업</span><span style="color:#777;font-weight:600">평당 10,000원</span></label>
<label class="checkline"><input id="mealOn" type="checkbox" checked><span>식비</span><span style="color:#777;font-weight:600">인당 20,000원</span></label>
<label class="checkline"><input id="wasteOn" type="checkbox" checked><span>폐기물 처리</span><span style="color:#777;font-weight:600">50,000원</span></label>
</section>

<section class="cost" aria-live="polite">
<h2>견적 내역</h2>
<div class="costline"><span>벽지</span><strong id="rPaper"></strong></div>
<div class="costline"><span>인건비</span><strong id="rLabor"></strong></div>
<div class="costline"><span>초배작업</span><strong id="rPrep"></strong></div>
<div class="costline"><span>식비</span><strong id="rMeal"></strong></div>
<div class="costline"><span>폐기물</span><strong id="rWaste"></strong></div>
<div class="costline" id="silkLine"><span>실크 부자재</span><strong id="rSilk"></strong></div>
<div class="total"><span>총 견적금액</span><strong id="rTotal"></strong></div>
</section>

<div class="actions">
<button class="action" id="printBtn">▣ &nbsp;견적서 인쇄</button>
<button class="action dark" id="pdfBtn">▤ &nbsp;PDF 저장하기</button>
</div>

</main>

<script>
const DATA={
25:{'포함':{'소폭':38,'광폭':20,'실크':17},'제외':{'소폭':32,'광폭':17,'실크':14}},
33:{'포함':{'소폭':48,'광폭':26,'실크':23},'제외':{'소폭':40,'광폭':22,'실크':19}},
45:{'포함':{'소폭':65,'광폭':35,'실크':31},'제외':{'소폭':54,'광폭':29,'실크':26}},
51:{'포함':{'소폭':80,'광폭':44,'실크':38},'제외':{'소폭':66,'광폭':37,'실크':32}}
};
const PRICE={'소폭':15000,'광폭':21000,'실크':44000};
let area=25,wall='소폭',ceiling='포함';

const $=id=>document.getElementById(id);
const won=n=>Math.round(n).toLocaleString('ko-KR')+'원';

function makeButtons(id,items,selected,cb){
 const box=$(id); box.innerHTML='';
 items.forEach(item=>{
  const b=document.createElement('button'); b.type='button'; b.className='opt'+(item===selected?' selected':''); b.textContent=item+(id==='areaBtns'?'평':'');
  b.addEventListener('click',()=>{cb(item);$('rolls').value=DATA[area][ceiling][wall];makeButtons(id,items,item,cb);calc()});
  box.appendChild(b);
 });
}
makeButtons('areaBtns',[25,33,45,51],area,v=>area=v);
makeButtons('wallBtns',['소폭','광폭','실크'],wall,v=>wall=v);
makeButtons('ceilingBtns',['포함','제외'],ceiling,v=>ceiling=v);

function calc(){
 const baseRolls=DATA[area][ceiling][wall];
 const currentRollInput=Number($('rolls').value);
 const rolls=currentRollInput>0?currentRollInput:baseRolls;
 const people=Math.max(0,Number($('people').value)||0);
 const paper=rolls*PRICE[wall];
 const labor=people*260000;
 const prep=$('prepOn').checked?area*10000:0;
 const meal=$('mealOn').checked?people*20000:0;
 const waste=$('wasteOn').checked?50000:0;
 const silk=wall==='실크'?100000:0;
 const total=paper+labor+prep+meal+waste+silk;
 $('paperNote').textContent=`${wall} ${PRICE[wall].toLocaleString()}원 × ${rolls}롤 = ${paper.toLocaleString()}원 · 천장 ${ceiling}`;
 $('rPaper').textContent=won(paper);
 $('rLabor').textContent=won(labor);
 $('rPrep').textContent=won(prep);
 $('rMeal').textContent=won(meal);
 $('rWaste').textContent=won(waste);
 $('rSilk').textContent=won(silk);
 $('silkLine').style.display=wall==='실크'?'flex':'none';
 $('rTotal').textContent=won(total);
}
$('rolls').addEventListener('input',calc);
['people','prepOn','mealOn','wasteOn'].forEach(id=>$(id).addEventListener('change',calc));
$('homeBtn').addEventListener('click',()=>{area=25;wall='소폭';ceiling='포함';$('people').value='';$('rolls').value=DATA[25]['포함']['소폭'];$('prepOn').checked=true;$('mealOn').checked=true;$('wasteOn').checked=true;makeButtons('areaBtns',[25,33,45,51],25,v=>area=v);makeButtons('wallBtns',['소폭','광폭','실크'],'소폭',v=>wall=v);makeButtons('ceilingBtns',['포함','제외'],'포함',v=>ceiling=v);calc()});
$('printBtn').addEventListener('click',()=>window.print());
$('pdfBtn').addEventListener('click',()=>window.print());
$('rolls').value=DATA[25]['포함']['소폭'];
calc();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js?v=3',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
</script>
</body>
</html>
